<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>الحجوزات – احجز مرفق</title><meta name="description" content="تقويم حجوزات مرافق متوسطة لبيد بن ربيعة باليوم والأسبوع"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet"><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="assets/core.css"><link rel="stylesheet" href="assets/fb.css"></head><body class="pubsite">
<div id="hdr"></div>
<section class="hero3 slim"><div class="h3g"><div class="h3t"><span class="h3pill"><span class="tg" data-ico="calendar"></span>تقويم الحجوزات</span><h1><em>الحجوزات</em></h1><p class="h3p">اعرف المرافق المحجوزة والمتاحة قبل أن تحجز: باليوم حصةً حصة، وبالأسبوع يوماً يوماً.</p><div class="h3act"><a class="btn" href="book.html">احجز مرفقاً</a></div></div></div></section>
<section class="hsec"><div class="wrap">
<div class="calbar"><div class="tabs" id="vw"><button data-v="day" class="on">اليوم</button><button data-v="week">الأسبوع</button></div>
<button class="btn sec sm" id="pv">السابق</button><input type="date" id="d" aria-label="التاريخ"><button class="btn sec sm" id="nx">التالي</button><button class="btn sec sm" id="td">اليوم</button><span class="sp"></span><span class="t" id="ttl"></span></div>
<div class="calbar fl2"><div class="tabs" id="md"><button data-m="table" class="on"><i data-ico="grid"></i>جدول</button><button data-m="cards"><i data-ico="list"></i>بطاقات</button></div>
<label class="flt"><span>المرفق</span><select id="fF"><option value="">كل المرافق</option></select></label>
<label class="flt"><span>الشخص</span><select id="fP"><option value="">كل الأشخاص</option></select></label>
<button class="btn sec sm" id="clr" hidden>إلغاء الفرز</button><span class="sp"></span><span class="cnt" id="cnt"></span></div>
<div id="cal"><p class="sub">جارٍ التحميل…</p></div>
<div class="lgd dk"><span><i class="f"></i>متاح</span><span><i class="a"></i>محجوز</span><span><i class="p"></i>بانتظار الاعتماد</span></div></div></section>
<section class="hsec"><div class="hh rv"><div><small>المرافق</small><h2>المرافق المتاحة للحجز</h2></div></div><div class="fcds wrap" id="fl"></div></section>
<div id="ftr"></div>
<script src="assets/config.js"></script><script src="assets/chrome.js"></script><script src="assets/about-icons.js"></script><script src="assets/pubfb.js"></script><script>
pubInit("bookings.html");
(function(){
  const $=(i)=>document.getElementById(i), today=pToday();
  let view="day", mode="table", fF="", fP="", date=/^#\d{4}-\d\d-\d\d$/.test(location.hash)?location.hash.slice(1):today, C=null;
  const closed=(d)=>C.closed_weekdays.includes(pDow(d));
  const match=(b)=>(!fF||b.facility_id===fF)&&(!fP||b.booker===fP);
  const empty=(t)=>`<div class="card emp"><b>${t}</b><p class="sub" style="margin:4px 0 0">جرّب يوماً آخر أو ألغِ الفرز.</p></div>`;
  function fillFilters(){
    $("fF").innerHTML='<option value="">كل المرافق</option>'+C.facilities.map(f=>`<option value="${f.id}"${f.id===fF?" selected":""}>${pesc(f.name)}</option>`).join("");
    const names=[...new Set(C.bookings.map(b=>b.booker).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"ar")); if(fP&&!names.includes(fP)) names.unshift(fP);
    $("fP").innerHTML='<option value="">كل الأشخاص</option>'+names.map(n=>`<option${n===fP?" selected":""}>${pesc(n)}</option>`).join("");
    $("clr").hidden=!(fF||fP);
  }
  function draw(){
    const F=C.facilities.filter(f=>!fF||f.id===fF), P=C.periods, ws=pWeekStart(date);
    const days=view==="day"?[date]:Array.from({length:7},(_,i)=>pAdd(ws,i)).filter(d=>!closed(d));
    const B=C.bookings.filter(b=>days.includes(b.date)&&match(b));
    $("d").value=date; fillFilters();
    document.querySelectorAll("#vw button").forEach(b=>b.classList.toggle("on",b.dataset.v===view));
    document.querySelectorAll("#md button").forEach(b=>b.classList.toggle("on",b.dataset.m===mode));
    $("ttl").textContent=view==="day"?pDay(date)+" · "+pHijri(date):`${pShort(ws)} – ${pShort(pAdd(ws,6))}`;
    $("cnt").textContent=B.length?`${B.length} حجز · ${B.reduce((n,b)=>n+b.periods.length,0)} حصة`:"";
    if(!C.facilities.length){$("cal").innerHTML='<p class="sub">لم تُفعَّل مرافق للحجز بعد.</p>';return;}
    if(view==="day"&&closed(date)){$("cal").innerHTML=`<div class="card emp"><b>${P_DAYS[pDow(date)]}</b><p class="sub" style="margin:4px 0 0">لا يُقبل الحجز في هذا اليوم.</p></div>`;return;}
    // ---- بطاقات ----
    if(mode==="cards"){
      if(!B.length){$("cal").innerHTML=empty("لا حجوزات مطابقة");return;}
      $("cal").innerHTML=days.map(d=>{const L=B.filter(b=>b.date===d).sort((x,y)=>((perOf(C,x)[0]||{}).starts||"")<((perOf(C,y)[0]||{}).starts||"")?-1:1); if(!L.length) return "";
        return (view==="week"?`<h3 class="dayh"><button type="button" data-d="${d}">${P_DAYS[pDow(d)]}${d===C.today?" · اليوم":""}</button><small>${pShort(d)} · ${L.length} حجز</small></h3>`:"")+`<div class="bkcs">${L.map(b=>bkCard(C,b)).join("")}</div>`;}).join("");
      return;
    }
    // ---- جدول اليوم: الحصص × المرافق ----
    const cellDay=(p,f)=>{const b=bookOf(C,date,f.id,p.id); if(!b) return '<span class="st free">متاح</span>'; if(!match(b)) return '<span class="st dim">محجوز</span>';
      return `<span class="st ${b.status}">${whoHTML(b)}<span class="st-f">${ico("building")}${pesc(f.name)}</span><em>${LBL[b.status]}</em></span>`;};
    if(view==="day"){
      $("cal").innerHTML=`<div class="tw card" style="padding:0"><table class="sch pubsch"><thead><tr><th>الحصة</th>${F.map(f=>`<th>${pesc(f.name)}</th>`).join("")}</tr></thead><tbody>${P.map(p=>p.bookable?`<tr class="${date===C.today&&p.starts<=C.now&&C.now<p.ends?"now":""}"><td><b>${pesc(p.name)}</b><br><small class="sub">${p.starts} – ${p.ends}</small></td>${F.map(f=>`<td>${cellDay(p,f)}</td>`).join("")}</tr>`:`<tr class="brkrow"><td colspan="${F.length+1}">${pesc(p.name)} · ${p.starts} – ${p.ends}</td></tr>`).join("")}</tbody></table></div>`;
      return;
    }
    // ---- جدول الأسبوع: الأيام × الحصص ----
    const PB=P.filter(p=>p.bookable);
    const chip=(b)=>`<span class="wchip ${b.status}" title="${LBL[b.status]}"><span class="who-p sm"><b>${pesc((b.booker||"")[0]||"")}</b>${b.photo?`<img src="${pPhoto(b.photo)}" alt="" loading="lazy" onerror="this.remove()">`:""}</span><span><b>${pesc(facName(C,b.facility_id))}</b><small>${pesc(b.booker||"")}${b.subject?" · "+pesc(b.subject):""}</small></span></span>`;
    $("cal").innerHTML=`<div class="tw card" style="padding:0"><table class="sch pubsch wkt"><thead><tr><th>اليوم</th>${PB.map(p=>`<th>${pesc(p.name)}<small>${p.starts} – ${p.ends}</small></th>`).join("")}</tr></thead><tbody>${days.map(d=>`<tr class="${d===C.today?"now":""}"><td><button type="button" class="dlink" data-d="${d}"><b>${P_DAYS[pDow(d)]}${d===C.today?" · اليوم":""}</b><small>${pShort(d)}</small></button></td>${PB.map(p=>{const L=B.filter(b=>b.date===d&&b.periods.includes(p.id));return `<td>${L.map(chip).join("")||'<span class="st free">—</span>'}</td>`;}).join("")}</tr>`).join("")}</tbody></table></div>`;
  }
  function load(){ const ws=pWeekStart(date); return pubCalendar(ws,pAdd(ws,6)).then(c=>{C=c;draw();$("fl").innerHTML=c.facilities.map(f=>facCard(f,c)).join("")||'<p class="sub">لم تُفعَّل مرافق للحجز بعد.</p>';}).catch(()=>{$("cal").innerHTML='<p class="err">تعذر تحميل التقويم الآن. حاول بعد قليل.</p>';}); }
  const go=(d)=>{date=d;history.replaceState(null,"","#"+d);load();};
  $("vw").onclick=(e)=>{const b=e.target.closest("[data-v]");if(b){view=b.dataset.v;C&&draw();}};
  $("md").onclick=(e)=>{const b=e.target.closest("[data-m]");if(b){mode=b.dataset.m;C&&draw();}};
  $("fF").onchange=(e)=>{fF=e.target.value;draw();}; $("fP").onchange=(e)=>{fP=e.target.value;draw();};
  $("clr").onclick=()=>{fF="";fP="";draw();};
  $("pv").onclick=()=>go(pAdd(date,view==="day"?-1:-7)); $("nx").onclick=()=>go(pAdd(date,view==="day"?1:7)); $("td").onclick=()=>go(today);
  $("d").onchange=(e)=>e.target.value&&go(e.target.value);
  $("cal").onclick=(e)=>{const b=e.target.closest("[data-d]");if(b){view="day";go(b.dataset.d);}};
  if(matchMedia("(max-width:700px)").matches) mode="cards";
  load();
})();
</script></body></html>
